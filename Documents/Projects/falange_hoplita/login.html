<!DOCTYPE html>
<html>

<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1a2332 0%, #2a384f 50%, #3a4556 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Animação de fundo */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .logo-container {
      margin-bottom: 40px;
      z-index: 1;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo {
      width: 150px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .login-container {
      background: rgba(42, 56, 79, 0.95);
      backdrop-filter: blur(20px);
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 0 30px rgba(255, 107, 53, 0.1);
      width: 400px;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      margin: 0 0 10px 0;
      font-size: 28px;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 40px 0;
      color: #b8c5d6;
      font-size: 14px;
      font-weight: 400;
    }

    .input-group {
      margin-bottom: 30px;
      text-align: left;
      position: relative;
      padding-top: 12px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 13px;
      color: #e0e6ed;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 15px 15px 15px 50px;
      border: 2px solid transparent;
      background: rgba(58, 69, 86, 0.8);
      color: white;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    input:focus {
      outline: none;
      border-color: #ff6b35;
      background: rgba(66, 80, 112, 0.9);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
      transform: translateY(-2px);
    }

    input::placeholder {
      color: #8b92a8;
      font-style: italic;
    }

    .icon {
      position: absolute;
      left: 18px;
      top: calc(50% + 6px);
      transform: translateY(-50%);
      color: #8b92a8;
      font-size: 20px;
      transition: color 0.3s ease;
    }

    input:focus+.icon {
      color: #ff6b35;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 20px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
      background: linear-gradient(135deg, #e55a2b 0%, #d44f24 100%);
    }

    button:active {
      transform: translateY(0);
    }

    .error {
      color: #ff6b6b;
      margin-top: 20px;
      font-size: 13px;
      display: none;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-10px);
      }

      75% {
        transform: translateX(10px);
      }
    }

    .user-info {
      font-size: 11px;
      color: #8b92a8;
      margin-top: 25px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .user-info strong {
      color: #b8c5d6;
    }

    /* Loading spinner */
    .loading {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <img src="ITS.png" alt="Logo" class="logo">
  </div>

  <div class="login-container">
    <h2>Bem-vindo</h2>
    <p class="subtitle">Acesse o terminal de atendimento</p>

    <div class="input-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" placeholder="Digite seu usuário" autofocus>
      <span class="icon">👤</span>
    </div>

    <div class="input-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha">
      <span class="icon">🔒</span>
    </div>

    <button onclick="login()" id="loginBtn">
      <span id="btnText">Entrar</span>
      <div class="loading" id="loading"></div>
    </button>

    <div id="error" class="error">Usuário ou senha inválidos!</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username && password) {
        // Mostrar loading
        document.getElementById('btnText').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loginBtn').disabled = true;

        ipcRenderer.send('login', username, password);
      }
    }

    ipcRenderer.on('login-error', () => {
      // Esconder loading
      document.getElementById('btnText').style.display = 'inline';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('loginBtn').disabled = false;

      // Mostrar erro
      document.getElementById('error').style.display = 'block';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();

      setTimeout(() => {
        document.getElementById('error').style.display = 'none';
      }, 4000);
    });

    // Enter key submits
    document.getElementById('username').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('password').focus();
      }
    });

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        login();
      }
    });

    // Efeito de digitação
    document.getElementById('username').addEventListener('input', (e) => {
      if (e.target.value.length > 0) {
        e.target.style.borderColor = 'rgba(255, 107, 53, 0.3)';
      }
    });

    document.getElementById('password').addEventListener('input', (e) => {
      if (e.target.value.length > 0) {
        e.target.style.borderColor = 'rgba(255, 107, 53, 0.3)';
      }
    });
  </script>
</body>

</html>
